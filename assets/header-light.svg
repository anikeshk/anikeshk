<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Anikesh G Kamath — Software engineer building security automation — the APIs, pipelines, and agentic workflows that turn security findings into fixes.">
  <style>
    @font-face { font-family: "F"; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "W"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "W"; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "M"; font-weight: 500; src: url(data:font/woff2;base64,) format("woff2"); }
    .eyebrow { font: 500 12px "M", ui-monospace, monospace; letter-spacing: 0.16em; fill: #5a5a5a; }
    .name { font: 600 64px "F", Georgia, serif; letter-spacing: -0.005em; fill: #1b1b1b; }
    .tag { font: 400 19px "W", system-ui, sans-serif; fill: #1b1b1b; }
    .meta { font: 400 15px "W", system-ui, sans-serif; fill: #5a5a5a; }
    .meta tspan.b { font-weight: 600; fill: #1b1b1b; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; } .d4 { animation-delay: .35s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" width="879" height="299" rx="12" fill="#fdfdfd" stroke="#d6d6d6"/>
  <g class="rise d1">
    <circle cx="44" cy="58" r="4" fill="#1b1b1b"/>
    <text class="eyebrow" x="58" y="62">SANTA CLARA, CALIFORNIA</text>
    <text class="eyebrow" x="840" y="62" text-anchor="end">ANIKESHK.COM ↗</text>
  </g>
  <text class="name rise d2" x="38" y="138">Anikesh G Kamath</text>
  <g class="rise d3">
    <text class="tag" x="40" y="186">Software engineer building security automation — the APIs,</text>
    <text class="tag" x="40" y="214">pipelines, and agentic workflows that turn security findings into fixes.</text>
  </g>
  <g class="rise d4">
    <line x1="40" y1="242" x2="840" y2="242" stroke="#d6d6d6"/>
    <text class="meta" x="40" y="272"><tspan class="b">Senior Software Engineer at Lineaje</tspan> · MSCS from Northeastern</text>
  </g>
</svg>
